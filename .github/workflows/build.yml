name: Build MYRA Direct APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Fresh Project and Build APK
        run: |
          # पुरानी ज़िप या क्रैश फाइलों को पूरी तरह साफ़ करें
          rm -rf app build .gradle gradle gradlew gradlew.bat *.zip

          # एकदम नया और एरर-फ्री एंड्रॉइड प्रोजेक्ट ढांचा बनाएं
          mkdir -p app/src/main/java/com/myra/ai
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout

          # 1. settings.gradle
          printf 'rootProject.name = "MYRA AI"\ninclude ":app"\n' > settings.gradle

          # 2. root build.gradle
          printf 'buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath "com.android.tools.build:gradle:8.2.0"\n        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20"\n    }\n}\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n' > build.gradle

          # 3. app/build.gradle
          printf 'plugins {\n    id "com.android.application"\n}\nandroid {\n    namespace "com.myra.ai"\n    compileSdk 34\n    defaultConfig {\n        applicationId "com.myra.ai"\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName "1.0"\n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n        }\n    }\n}\ndependencies {\n    implementation "androidx.core:core-ktx:1.12.0"\n    implementation "androidx.appcompat:appcompat:1.6.1"\n    implementation "com.google.android.material:material:1.11.0"\n}\n' > app/build.gradle

          # 4. AndroidManifest.xml
          printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    package="com.myra.ai">\n    <application\n        android:allowBackup="true"\n        android:icon="@mipmap/ic_launcher"\n        android:label="MYRA AI"\n        android:roundIcon="@mipmap/ic_launcher_round"\n        android:supportsRtl="true"\n        android:theme="@style/Theme.AppCompat.Light.NoActionBar">\n        <activity\n            android:name=".MainActivity"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml

          # 5. strings.xml
          printf '<resources>\n    <string name="app_name">MYRA AI</string>\n</resources>\n' > app/src/main/res/values/strings.xml

          # 6. MainActivity.kt
          printf 'package com.myra.ai\n\nimport android.os.Bundle\nimport androidx.appcompat.app.AppCompatActivity\n\nclass MainActivity : AppCompatActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_main)\n    }\n}\n' > app/src/main/java/com/myra/ai/MainActivity.kt

          # 7. activity_main.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"\n    android:layout_width="match_parent"\n    android:layout_height="match_parent"\n    android:gravity="center"\n    android:orientation="vertical"\n    android:background="#121212">\n    <TextView\n        android:layout_width="wrap_content"\n        android:layout_height="wrap_content"\n        android:text="MYRA AI Ready"\n        android:textColor="#FFFFFF"\n        android:textSize="24sp"\n        android:textStyle="bold"/>\n</LinearLayout>\n' > app/src/main/res/layout/activity_main.xml

          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myra-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
