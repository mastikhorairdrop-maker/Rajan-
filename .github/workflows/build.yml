name: Build Combined MYRA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean Manifest Conflict and Build APK
        run: |
          # सभी ज़िप फाइलों को अनजिप करें
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Extracting $z..."
              unzip -o "$z"
            fi
          done

          # यदि ज़िप के अंदर कोई फोल्डर हो तो उन्हें बाहर रूट पर लाएं
          if [ -d "MYRA" ]; then
            cp -r MYRA/* .
          elif [ -d "myra-ai-main" ]; then
            cp -r myra-ai-main/* .
          fi

          # सबसे जरूरी कदम: मेनिफेस्ट फाइलों के टकराव को रोकने के लिए पुरानी/फालतू मेनिफेस्ट हटाएं
          # और सुनिश्चित करें कि app/src/main/AndroidManifest.xml सही सलामत रहे
          mkdir -p app/src/main
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            if [ -f "AndroidManifest.xml" ]; then
              mv AndroidManifest.xml app/src/main/AndroidManifest.xml
            else
              printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    package="com.myra.ai">\n    <application\n        android:label="MYRA AI"\n        android:theme="@android:style/Theme.NoTitleBar">\n        <activity android:name=".MainActivity"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml
            fi
          fi

          # रूट लेवल की फालतू मेनिफेस्ट फाइल हटा दें ताकि मर्ज एरर न आए
          rm -f AndroidManifest.xml

          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          if [ ! -f "settings.gradle" ]; then
            printf 'rootProject.name = "MYRA"\ninclude ":app"\n' > settings.gradle
          fi

          if [ ! -f "build.gradle" ]; then
            printf 'buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath "com.android.tools.build:gradle:8.2.0"\n        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20"\n    }\n}\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n' > build.gradle
          fi

          if [ ! -f "app/build.gradle" ]; then
            printf 'plugins {\n    id "com.android.application"\n}\nandroid {\n    namespace "com.myra.ai"\n    compileSdk 34\n    defaultConfig {\n        applicationId "com.myra.ai"\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName "1.0"\n    }\n}\n' > app/build.gradle
          fi

          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myra-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
