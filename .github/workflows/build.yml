name: Build MYRA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Stable APK
        run: |
          rm -rf app build .gradle gradle gradlew gradlew.bat *.zip

          mkdir -p app/src/main/java/com/myra/ai
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout

          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > gradle.properties

          printf 'include ":app"\n' > settings.gradle

          printf 'buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath "com.android.tools.build:gradle:7.4.2"\n        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10"\n    }\n}\n\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n' > build.gradle

          printf 'apply plugin: "com.android.application"\n\nandroid {\n    namespace "com.myra.ai"\n    compileSdk 33\n    defaultConfig {\n        applicationId "com.myra.ai"\n        minSdk 24\n        targetSdk 33\n        versionCode 1\n        versionName "1.0"\n    }\n}\n\ndependencies {\n    implementation "androidx.core:core-ktx:1.9.0"\n    implementation "androidx.appcompat:appcompat:1.6.1"\n    implementation "com.google.android.material:material:1.8.0"\n}\n' > app/build.gradle

          printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.myra.ai">\n    <application android:label="MYRA AI" android:theme="@style/Theme.AppCompat.Light.NoActionBar">\n        <activity android:name=".MainActivity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml

          printf '<resources>\n    <string name="app_name">MYRA AI</string>\n</resources>\n' > app/src/main/res/values/strings.xml

          printf 'package com.myra.ai;\nimport android.os.Bundle;\nimport androidx.appcompat.app.AppCompatActivity;\npublic class MainActivity extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n    }\n}\n' > app/src/main/java/com/myra/ai/MainActivity.java

          printf '<?xml version="1.0" encoding="utf-8"?>\n<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"\n    android:layout_width="match_parent" android:layout_height="match_parent"\n    android:gravity="center" android:orientation="vertical" android:background="#121212">\n    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"\n        android:text="MYRA AI Ready" android:textColor="#FFFFFF" android:textSize="24sp" android:textStyle="bold"/>\n</LinearLayout>\n' > app/src/main/res/layout/activity_main.xml

          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          gradle wrapper --gradle-version 7.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myra-debug-apk
          path: app/build/outputs/apk/debug/*.apk
